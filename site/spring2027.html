<!doctype html>
<html lang="zh-CN" data-title-key="spring.docTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UIUC 27Spring GenEd 水课指北</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/logo-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#FAFAFA">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="慵懒选课">
  <meta property="og:title" content="UIUC 27Spring GenEd 水课指北">
  <meta property="og:description" content="按 2027 春实际授课老师的历史给分排序的 Gen Ed 清单：A 率、GPA、上课时间、线上/线下。">
  <meta property="og:image" content="https://wzx666296.github.io/easy-courses/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css?v=34">
  <link rel="stylesheet" href="spring2027.css?v=34">
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="index.html" data-keep-lang aria-label="Home"><img class="brand-logo" src="img/logo-64.png" alt="" width="24" height="24"><span data-i18n="brand">慵懒</span></a>
      <b data-i18n="nav.spring">选课指北</b>
      <a href="search.html" data-keep-lang data-i18n="nav.search">全部课程查询</a>
      <span class="lang-switch" role="group" data-i18n-aria-label="lang.label"></span>
    </nav>
    <h1 data-i18n="spring.title">UIUC 27Spring GenEd 水课指北</h1>
    <p class="sub" id="intro" data-i18n="loading">加载中…</p>
  </header>

  <main>
    <section class="toolbar" data-i18n-aria-label="spring.filters">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" data-i18n-placeholder="spring.q" data-i18n-aria-label="spring.q" autocomplete="off">
      </label>
      <div class="chips" id="gened-chips" role="group" data-i18n-aria-label="spring.genedGroup"></div>
      <div class="chips sub" id="sub-chips" role="group" data-i18n-aria-label="spring.subGroup" hidden></div>
      <p class="req" id="req" hidden></p>
      <div class="controls">
        <label><span data-i18n="spring.mode">形式</span>
          <select id="mode">
            <option value="" data-i18n="all">全部</option>
            <option value="online" data-i18n="spring.mode.online">有线上班</option>
            <option value="inperson" data-i18n="spring.mode.inperson">有线下班</option>
          </select>
        </label>
        <label><span data-i18n="spring.half">时间</span>
          <select id="half">
            <option value="" data-i18n="all">全部</option>
            <option value="full" data-i18n="spring.half.full">有整学期班</option>
            <option value="A" data-i18n="spring.half.A">有前八周班</option>
            <option value="B" data-i18n="spring.half.B">有后八周班</option>
          </select>
        </label>
        <label><span data-i18n="spring.sort">排序</span>
          <select id="sort">
            <option value="aRate" data-i18n="spring.sort.aRate">最佳老师 A 率（A+/A）</option>
            <option value="aRateInclMinus" data-i18n="spring.sort.aRateInclMinus">最佳老师 A 率（含 A-）</option>
            <option value="gpa" data-i18n="spring.sort.gpa">最佳老师 GPA</option>
            <option value="code" data-i18n="spring.sort.code">课号</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="show-ta"> <span data-i18n="spring.showTA">显示讨论课老师</span></label>
      </div>
    </section>

    <p class="summary" id="summary" aria-live="polite"></p>
    <div class="cards" id="cards"></div>

    <section id="not-offered" hidden>
      <h2 data-i18n="spring.notOfferedTitle">2027 春不开的课</h2>
      <div class="cards" id="not-offered-cards"></div>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="i18n.js?v=34"></script>
  <script src="spring-common.js?v=34"></script>
  <script src="spring2027.js?v=34"></script>
</body>
</html>
