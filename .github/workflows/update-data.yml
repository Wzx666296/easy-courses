# Weekly data refresh: re-download the Spring 2027 schedule (Course Explorer),
# WAF grade data and the GPA dataset, rebuild the site's JSON, and commit if
# anything changed. The build scripts refuse to overwrite good data when the
# new download looks broken, so a failed run leaves the site as it was.
name: Update course data

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (8–9 AM in Champaign)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild Spring 2027 data
        run: python scripts/build_spring2027.py --refresh

      - name: Rebuild all-courses data
        run: python scripts/build_data.py --refresh

      - name: Commit changes
        run: |
          if git diff --quiet -- site/data data/spring2027; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/spring2027
          git commit -m "Update course data ($(date -u +%Y-%m-%d))"
          git push
